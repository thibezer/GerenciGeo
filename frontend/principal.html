<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GerenciGeo — Sistema de Gerenciamento Geodésico Profissional com suporte a GNSS, SIRGAS 2000, UTM e shapefile." />
    <meta name="keywords" content="Geodésico, GNSS, Topografia, Georreferenciamento, SIRGAS 2000, UTM" />
    <meta name="author" content="GerenciGeo" />
    <meta property="og:title" content="GerenciGeo | Technical Precision" />
    <meta property="og:description" content="Sistema de Gerenciamento Geodésico Profissional com suporte a GNSS, SIRGAS 2000, UTM e shapefile." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.svg" />
    <meta name="theme-color" content="#0c1510" />
    <title>GerenciGeo | Technical Precision</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  </head>
  <body class="h-screen flex overflow-hidden">
    <!-- Sidebar (Barra Lateral Compacta) -->
    <aside id="sidebar" class="w-56 glass-card border-r-0 border-y-0 rounded-none flex flex-col p-4 z-20">
      <div class="flex items-center justify-between mb-6 px-2" id="sidebar-header">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-10 h-10 bg-mint-vibrant rounded-technical flex items-center justify-center shadow-[0_0_15px_rgba(0,245,160,0.3)] shrink-0">
            <i data-lucide="crosshair" class="text-forest-deep w-6 h-6"></i>
          </div>
          <h1 class="text-xl font-bold tracking-tight sidebar-text truncate">Gerenci<span class="text-mint-vibrant">Geo</span></h1>
        </div>
        <button id="btn-toggle-sidebar" class="text-white/60 hover:text-mint-vibrant p-1 hover:bg-white/5 rounded transition-all shrink-0 ml-1" title="Expandir menu">
          <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>
      </div>

      <nav class="flex-1 space-y-2">
        <a href="#dashboard" class="nav-link active flex items-center gap-3 px-3 py-2 rounded-technical transition-all hover:bg-white/5 group">
          <i data-lucide="layout-dashboard" class="w-5 h-5 text-white/60 group-hover:text-mint-vibrant shrink-0"></i>
          <span class="sidebar-text">Dashboard</span>
        </a>
        <a href="#clientes" class="nav-link flex items-center gap-3 px-3 py-2 rounded-technical transition-all hover:bg-white/5 group">
          <i data-lucide="users" class="w-5 h-5 text-white/60 group-hover:text-mint-vibrant shrink-0"></i>
          <span class="sidebar-text">Clientes</span>
        </a>
        <a href="#levantamentos" class="nav-link local-only-route flex items-center gap-3 px-3 py-2 rounded-technical transition-all hover:bg-white/5 group">
          <i data-lucide="map-pin" class="w-5 h-5 text-white/60 group-hover:text-mint-vibrant shrink-0"></i>
          <span class="sidebar-text">Levantamentos</span>
        </a>
        <a href="#propriedades" class="nav-link flex items-center gap-3 px-3 py-2 rounded-technical transition-all hover:bg-white/5 group">
          <i data-lucide="home" class="w-5 h-5 text-white/60 group-hover:text-mint-vibrant shrink-0"></i>
          <span class="sidebar-text">Propriedades</span>
        </a>
        <a href="#hgo" class="nav-link local-only-route flex items-center gap-3 px-3 py-2 rounded-technical transition-all hover:bg-white/5 group">
          <i data-lucide="folder-tree" class="w-5 h-5 text-white/60 group-hover:text-mint-vibrant shrink-0"></i>
          <span class="sidebar-text">Organizador HGO</span>
        </a>
        <a href="#fronteira" class="nav-link local-only-route flex items-center gap-3 px-3 py-2 rounded-technical transition-all hover:bg-white/5 group">
          <i data-lucide="file-check" class="w-5 h-5 text-white/60 group-hover:text-mint-vibrant shrink-0"></i>
          <span class="sidebar-text">Área de Fronteira</span>
        </a>
        <a href="#ccir" class="nav-link local-only-route flex items-center gap-3 px-3 py-2 rounded-technical transition-all hover:bg-white/5 group">
          <i data-lucide="database" class="w-5 h-5 text-white/60 group-hover:text-mint-vibrant shrink-0"></i>
          <span class="sidebar-text">Banco CCIR</span>
        </a>
      </nav>

      <div class="mt-auto pt-6 border-t border-white/10 space-y-4" id="sidebar-footer">
        <div class="flex items-center gap-3 px-2">
          <div class="w-8 h-8 rounded-full bg-mint-vibrant/20 border border-mint-vibrant/40 flex items-center justify-center text-xs font-bold text-mint-vibrant shrink-0">
            AD
          </div>
          <div class="flex-1 min-w-0 sidebar-text">
            <p class="text-sm font-semibold truncate">Admin</p>
            <p class="text-[10px] text-white/40 truncate">Licença Profissional</p>
          </div>
        </div>
        <button class="w-full btn-secondary text-sm py-1.5 flex items-center justify-center gap-2" id="btn-sidebar-settings">
          <i data-lucide="settings" class="w-4 h-4 shrink-0"></i>
          <span class="sidebar-text">Configurações</span>
        </button>
      </div>
    </aside>

    <!-- Overlay da Sidebar Mobile -->
    <div id="sidebar-overlay" class="md:hidden"></div>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col relative min-w-0">
      <!-- Header Mobile com Hamburger -->
      <div class="h-14 border-b border-white/5 bg-[#111113]/90 backdrop-blur-md px-4 flex items-center justify-between md:hidden z-30 shrink-0">
        <div class="flex items-center gap-3">
          <button id="btn-hamburger-mobile" class="p-2 hover:bg-white/5 rounded text-white flex items-center justify-center cursor-pointer" title="Menu">
             <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h2 class="text-base font-bold text-white tracking-tight">Gerenci<span class="text-mint-vibrant">Geo</span></h2>
        </div>
        <div id="web-cloud-indicator-mobile" class="text-[9px] text-mint-vibrant/60 font-bold uppercase tracking-wider hidden">Hub Web Cloud</div>
      </div>

      <!-- Background Glows -->
      <div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] bg-mint-vibrant/5 blur-[120px] rounded-full -z-10"></div>
      <div class="absolute bottom-[-10%] left-[-10%] w-[30%] h-[30%] bg-mint-vibrant/5 blur-[100px] rounded-full -z-10"></div>

      <!-- Scrollable Container -->
      <div id="view-container" class="flex-1 overflow-y-auto p-3 sm:p-4 min-w-0">
        <!-- Views will be injected here -->
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
