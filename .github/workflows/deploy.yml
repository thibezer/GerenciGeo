name: Build Frontend

# A publicação do site é feita pelo deploy Git da própria Hostinger (build do frontend/ a cada push na main).
# Este workflow só valida que o frontend compila. O antigo passo SFTP gravava em public_html relativo ao
# login, fora da pasta do domínio, e dava "Deploy Success" sem atualizar o site.
on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Checkout UI_Componentes
      uses: actions/checkout@v4
      with:
        repository: thibezer/Componentes-UI
        path: UI_Componentes

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies & Build
      run: |
        cd frontend
        npm install
        npm run build
