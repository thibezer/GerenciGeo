name: Build and Deploy Frontend to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Checkout UI_Componentes
      uses: actions/checkout@v4
      with:
        repository: thibezer/Componentes-UI
        path: UI_Componentes

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies & Build
      run: |
        cd frontend
        npm install
        npm run build

    - name: Install paramiko & Deploy to Hostinger via SFTP
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_PORT: ${{ secrets.FTP_PORT }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        python -m pip install paramiko
        python scripts/deploy_hostinger.py
